name: Terraform OCI

on:
  push:
    branches:
      - main
      - dev
      - sbx
  pull_request:
    branches:
      - main
      - dev
      - sbx
    paths-ignore:
      - "**/*.md"
      - "**/*.MD"
      - "**/*.pdf"
      - "**/*.vsdx"
      - "index.html"
      - "docs-manifest.json"
      - ".nojekyll"
      - "site/**"
      - ".github/workflows/pages.yml"
      - "scripts/New-DocsManifest.ps1"
      - "scripts/Build-DocsSite.ps1"
      - "scripts/Test-DocsSite.ps1"
  workflow_dispatch:
    inputs:
      apply:
        description: Run terraform apply after plan
        required: false
        default: false
        type: boolean
  repository_dispatch:
    types:
      - stage-snapshot

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: true
  TF_INPUT: false
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  terraform-gate:
    name: Terraform Workflow Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      enabled: ${{ steps.gate.outputs.enabled }}
    steps:
      - name: Evaluate IS_ORIGIN
        id: gate
        shell: bash
        env:
          IS_ORIGIN: ${{ vars.IS_ORIGIN }}
        run: |
          set -euo pipefail

          if [[ "${IS_ORIGIN,,}" == "true" ]]; then
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
            echo "Terraform workflow is enabled for the origin repository."
          else
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
            echo "Terraform workflow is disabled; downstream Terraform jobs will be skipped."
          fi
  check-required-secrets-variables:
    needs: terraform-gate
    if: needs['terraform-gate'].outputs.enabled == 'true'
    name: Check Required Secrets and Variables
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      has_oci_credentials: ${{ steps.preflight.outputs.has_oci_credentials }}
      has_apply_inputs: ${{ steps.preflight.outputs.has_apply_inputs }}
      has_stage_publish_inputs: ${{ steps.preflight.outputs.has_stage_publish_inputs }}
      is_stage_repository: ${{ steps.preflight.outputs.is_stage_repository }}
    steps:
      - name: Evaluate required secrets and variables
        id: preflight
        shell: bash
        env:
          OCI_REGION: ${{ vars.OCI_REGION }}
          OCI_STATE_BUCKET: ${{ vars.OCI_STATE_BUCKET }}
          OCI_STATE_NAMESPACE: ${{ vars.OCI_STATE_NAMESPACE }}
          OCI_STATE_KEY: ${{ vars.OCI_STATE_KEY }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
          ENABLE_GITHUB_APPLY: ${{ vars.ENABLE_GITHUB_APPLY }}
          ENABLE_GITHUB_APPLY_MANUAL: ${{ github.event_name == 'workflow_dispatch' && inputs.apply == true && 'true' || 'false' }}
          STAGE_REPOSITORY: ${{ vars.STAGE_REPOSITORY }}
          STAGE_REPO_TOKEN: ${{ secrets.STAGE_REPO_TOKEN }}
          CURRENT_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          write_check() {
            local input_type="$1"
            local input_name="$2"
            local input_value="$3"
            local blue="\033[34m"
            local yellow="\033[33m"
            local green="\033[32m"
            local red="\033[31m"
            local reset="\033[0m"

            if [[ -n "${input_value}" ]]; then
              printf -- "- %b%s%b %b%s%b: %bpresent%b\n" "${blue}" "${input_type}" "${reset}" "${yellow}" "${input_name}" "${reset}" "${green}" "${reset}"
            else
              printf -- "- %b%s%b %b%s%b: %bmissing%b\n" "${blue}" "${input_type}" "${reset}" "${yellow}" "${input_name}" "${reset}" "${red}" "${reset}"
            fi
          }

          enable_github_apply=""
          [[ "${ENABLE_GITHUB_APPLY,,}" == "true" || "${ENABLE_GITHUB_APPLY_MANUAL,,}" == "true" ]] && enable_github_apply="true"

          echo "::group::Required secrets and variables"
          echo "OCI plan/apply requires:"
          write_check "variable" "OCI_REGION" "${OCI_REGION}"
          write_check "variable" "OCI_STATE_BUCKET" "${OCI_STATE_BUCKET}"
          write_check "variable" "OCI_STATE_NAMESPACE" "${OCI_STATE_NAMESPACE}"
          write_check "variable" "OCI_STATE_KEY" "${OCI_STATE_KEY}"
          write_check "secret" "OCI_TENANCY_OCID" "${OCI_TENANCY_OCID}"
          write_check "secret" "OCI_USER_OCID" "${OCI_USER_OCID}"
          write_check "secret" "OCI_FINGERPRINT" "${OCI_FINGERPRINT}"
          write_check "secret" "OCI_PRIVATE_KEY" "${OCI_PRIVATE_KEY}"
          echo ""
          echo "OCI native remote state uses the same API-key credentials and backend.tf configuration."
          echo ""
          echo "Apply requires:"
          write_check "variable/input" "ENABLE_GITHUB_APPLY=true or workflow_dispatch apply=true" "${enable_github_apply}"
          echo ""
          echo "Publish Github Demo Repo requires:"
          write_check "variable" "STAGE_REPOSITORY" "${STAGE_REPOSITORY}"
          write_check "secret" "STAGE_REPO_TOKEN" "${STAGE_REPO_TOKEN}"
          echo "::endgroup::"

          stage_repository_normalized=""
          if [[ -n "${STAGE_REPOSITORY}" ]]; then
            stage_repository_normalized="$(printf '%s' "${STAGE_REPOSITORY}" | tr -d '[:space:]')"
            stage_repository_normalized="${stage_repository_normalized#https://github.com/}"
            stage_repository_normalized="${stage_repository_normalized#http://github.com/}"
            stage_repository_normalized="${stage_repository_normalized#git@github.com:}"
          fi
          stage_repository_normalized="${stage_repository_normalized%.git}"
          stage_repository_normalized="${stage_repository_normalized#/}"
          stage_repository_normalized="${stage_repository_normalized%/}"

          if [[ -n "${stage_repository_normalized}" && "${CURRENT_REPOSITORY,,}" == "${stage_repository_normalized,,}" ]]; then
            echo "is_stage_repository=true" >> "${GITHUB_OUTPUT}"
            echo "Current repository matches the configured stage repository. Loop-prone jobs will be skipped for github-actions[bot]."
          else
            echo "is_stage_repository=false" >> "${GITHUB_OUTPUT}"
          fi

          if [[ -n "${OCI_REGION}" && -n "${OCI_STATE_BUCKET}" && -n "${OCI_STATE_NAMESPACE}" && -n "${OCI_STATE_KEY}" && -n "${OCI_TENANCY_OCID}" && -n "${OCI_USER_OCID}" && -n "${OCI_FINGERPRINT}" && -n "${OCI_PRIVATE_KEY}" ]]; then
            echo "has_oci_credentials=true" >> "${GITHUB_OUTPUT}"
            has_oci_credentials="true"
          else
            echo "has_oci_credentials=false" >> "${GITHUB_OUTPUT}"
            has_oci_credentials="false"
            echo "OCI credentials or explicit remote-state inputs are missing. Plan and apply jobs will be skipped."
          fi

          if [[ "${enable_github_apply}" == "true" && "${has_oci_credentials}" == "true" ]]; then
            echo "has_apply_inputs=true" >> "${GITHUB_OUTPUT}"
          else
            echo "has_apply_inputs=false" >> "${GITHUB_OUTPUT}"
          fi

          if [[ -n "${STAGE_REPOSITORY}" && -n "${STAGE_REPO_TOKEN}" ]]; then
            echo "has_stage_publish_inputs=true" >> "${GITHUB_OUTPUT}"
          else
            echo "has_stage_publish_inputs=false" >> "${GITHUB_OUTPUT}"
            echo "Stage publish variable/secret is missing. Stage publish job will be skipped."
          fi

  publish-stage-repo:
    name: Publish Github Demo Repo
    if: always() && needs['terraform-gate'].outputs.enabled == 'true' && (github.event_name != 'pull_request' && contains(fromJSON('["refs/heads/main","refs/heads/dev","refs/heads/sbx"]'), github.ref) && needs['check-required-secrets-variables'].outputs.is_stage_repository != 'true' && needs['check-required-secrets-variables'].outputs.has_stage_publish_inputs == 'true' && (needs.plan.result == 'success' || needs.plan.result == 'skipped') && (needs.create-git-tag.result == 'success' || needs.create-git-tag.result == 'skipped'))
    needs:
      - terraform-gate
      - check-required-secrets-variables
      - plan
      - create-git-tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Publish clean snapshot to stage repo
        env:
          STAGE_REPOSITORY: ${{ vars.STAGE_REPOSITORY }}
          STAGE_REPO_TOKEN: ${{ secrets.STAGE_REPO_TOKEN }}
          SOURCE_BRANCH: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ needs.create-git-tag.outputs.release_tag }}
          RELEASE_NOTES: ${{ needs.create-git-tag.outputs.release_notes }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${STAGE_REPO_TOKEN}" ]]; then
            echo "Missing required secret: STAGE_REPO_TOKEN" >&2
            exit 1
          fi

          if [[ -z "${STAGE_REPOSITORY}" ]]; then
            echo "Missing required repository variable: STAGE_REPOSITORY" >&2
            exit 1
          fi

          workdir="$(mktemp -d)"
          trap 'rm -rf "${workdir}"' EXIT

          rsync -a \
            --exclude='.git' \
            "${GITHUB_WORKSPACE}/" "${workdir}/repo/"

          cd "${workdir}/repo"

          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "${SOURCE_BRANCH}"
          git add .
          git commit -m "Stage snapshot from ${SOURCE_BRANCH}@${SOURCE_SHA}"

          if [[ -n "${RELEASE_TAG}" ]]; then
            release_notes="${RELEASE_NOTES:-}"
            if [[ -z "${release_notes}" ]]; then
              release_notes="- ${SOURCE_SHA}"
            fi

            tag_message="$(mktemp)"
            {
              echo "Release ${RELEASE_TAG} snapshot"
              echo
              echo "Source: ${SOURCE_BRANCH}@${SOURCE_SHA}"
              echo
              echo "Changes:"
              printf '%s\n' "${release_notes}"
            } > "${tag_message}"

            git tag -a "${RELEASE_TAG}" -F "${tag_message}"
          fi

          stage_repo_token="$(printf '%s' "${STAGE_REPO_TOKEN}" | tr -d '\r\n')"
          stage_repository_normalized="$(printf '%s' "${STAGE_REPOSITORY}" | tr -d '[:space:]')"
          stage_repository_normalized="${stage_repository_normalized#https://github.com/}"
          stage_repository_normalized="${stage_repository_normalized#http://github.com/}"
          stage_repository_normalized="${stage_repository_normalized#git@github.com:}"
          stage_repository_normalized="${stage_repository_normalized%.git}"
          stage_repository_normalized="${stage_repository_normalized#/}"
          stage_repository_normalized="${stage_repository_normalized%/}"

          if [[ ! "${stage_repository_normalized}" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "STAGE_REPOSITORY must be owner/repo or a GitHub repo URL. Got normalized value: ${stage_repository_normalized}" >&2
            exit 1
          fi

          target_repo="github.com/${stage_repository_normalized}"
          git remote add origin "https://x-access-token:${stage_repo_token}@${target_repo}.git"
          git push --force origin "${SOURCE_BRANCH}"
          if [[ -n "${RELEASE_TAG}" ]]; then
            if git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
              echo "Stage repo already has tag ${RELEASE_TAG}; leaving it unchanged."
            else
              git push origin "refs/tags/${RELEASE_TAG}"
            fi
          fi

          echo "Dispatching stage-snapshot to ${stage_repository_normalized}."
          GH_TOKEN="${stage_repo_token}" gh api \
            --method POST \
            "repos/${stage_repository_normalized}/dispatches" \
            --field event_type=stage-snapshot

  workflow-lint:
    name: Lint GitHub Workflows
    needs: terraform-gate
    if: needs['terraform-gate'].outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run actionlint
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # v1.7.12

  validate:
    name: Validate OCI Terraform
    timeout-minutes: 30
    needs:
      - terraform-gate
      - check-required-secrets-variables
    if: needs['terraform-gate'].outputs.enabled == 'true' && (needs['check-required-secrets-variables'].outputs.is_stage_repository != 'true' || github.actor != 'github-actions[bot]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: ./.github/actions/setup-terraform
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Terraform Init without backend
        run: terraform init -backend=false -input=false -no-color

      - name: Terraform fmt check
        run: terraform fmt -check -recursive

      - name: Terraform validate
        run: terraform validate -no-color

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6
        with:
          tflint_version: v0.59.1

      - name: Initialize TFLint
        run: tflint --init

      - name: Run TFLint
        run: tflint --recursive --format compact

      - name: Test root baseline with mock provider
        run: terraform test -no-color

      - name: Test documentation security
        shell: pwsh
        run: ./scripts/Test-DocsSecurity.ps1

      - name: Install verified terraform-docs
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/terraform-docs.tar.gz"
          curl --fail --silent --show-error --location --retry 3 https://github.com/terraform-docs/terraform-docs/releases/download/v0.16.0/terraform-docs-v0.16.0-linux-amd64.tar.gz -o "${archive}"
          printf '328c16cd6552b3b5c4686b8d945a2e2e18d2b8145b6b66129cd5491840010182  %s\n' "${archive}" | sha256sum --check
          mkdir -p "${RUNNER_TEMP}/terraform-tools"
          tar -xzf "${archive}" -C "${RUNNER_TEMP}/terraform-tools" terraform-docs
          echo "${RUNNER_TEMP}/terraform-tools" >> "${GITHUB_PATH}"

      - name: Check generated module reference documentation
        shell: pwsh
        run: ./scripts/Update-ModuleDocs.ps1 -Check

      - name: Configure provider cache
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/terraform-plugin-cache"
          echo "TF_PLUGIN_CACHE_DIR=${RUNNER_TEMP}/terraform-plugin-cache" >> "${GITHUB_ENV}"

      - name: Validate modules
        shell: pwsh
        run: ./test.ps1

      - name: Run mock-provider module plan tests
        shell: pwsh
        run: ./scripts/Test-TerraformModules.ps1 -SkipInit -NoColor

  create-git-tag:
    name: Create Git Tag
    if: always() && needs['terraform-gate'].outputs.enabled == 'true' && github.event_name != 'pull_request' && contains(fromJSON('["refs/heads/main","refs/heads/dev","refs/heads/sbx"]'), github.ref) && needs['check-required-secrets-variables'].outputs.is_stage_repository != 'true' && needs.validate.result == 'success' && (needs.plan.result == 'success' || needs.plan.result == 'skipped')
    needs:
      - terraform-gate
      - check-required-secrets-variables
      - validate
      - plan
    outputs:
      release_tag: ${{ steps.semver.outputs.release_tag }}
      release_notes: ${{ steps.semver.outputs.release_notes }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Create canonical GitHub release tag
        id: semver
        env:
          SOURCE_BRANCH: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --force --tags origin

          latest_tag="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)"
          if [[ -z "${latest_tag}" ]]; then
            latest_tag="v1.0.0"
          fi

          version="${latest_tag#v}"
          IFS='.' read -r major minor patch <<< "${version}"
          release_tag="v${major}.${minor}.$((patch + 1))"
          release_notes="$(git log -n 20 --format='- %s (%h)' "${latest_tag}..${SOURCE_SHA}" || true)"
          if [[ -z "${release_notes}" ]]; then
            release_notes="- ${SOURCE_SHA}"
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/${release_tag}" >/dev/null 2>&1; then
            echo "Tag ${release_tag} already exists on origin."
          else
            git tag -a "${release_tag}" "${SOURCE_SHA}" -m "Release ${release_tag} from ${SOURCE_BRANCH}@${SOURCE_SHA}"
            git push origin "refs/tags/${release_tag}"
          fi

          {
            echo "release_tag=${release_tag}"
            echo "release_notes<<EOF"
            echo "${release_notes}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

  plan:
    name: Plan OCI Terraform
    needs:
      - terraform-gate
      - check-required-secrets-variables
      - validate
    if: needs['terraform-gate'].outputs.enabled == 'true' && (always() && github.event_name != 'pull_request' && needs.validate.result == 'success' && needs['check-required-secrets-variables'].outputs.has_oci_credentials == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: ./.github/actions/setup-terraform
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Write OCI private key
        shell: bash
        env:
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          key_path="${RUNNER_TEMP}/oci_api_key.pem"
          private_key="${OCI_PRIVATE_KEY//$'\r'/}"
          if [[ "${private_key}" != *$'\n'* && "${private_key}" == *'\n'* ]]; then
            private_key="${private_key//\\n/$'\n'}"
          fi
          printf '%s\n' "${private_key}" > "${key_path}"
          chmod 600 "${key_path}"
          if ! openssl pkey -in "${key_path}" -noout -check > /dev/null 2>&1; then
            echo "OCI_PRIVATE_KEY is not a valid unencrypted PEM private key. Store the full PEM value as the GitHub secret, including its BEGIN/END lines." >&2
            exit 1
          fi
          delimiter="TF_VAR_PRIVATE_KEY_$(openssl rand -hex 16)"
          {
            printf 'TF_VAR_private_key<<%s\n' "${delimiter}"
            printf '%s\n' "${private_key}"
            printf '%s\n' "${delimiter}"
          } >> "${GITHUB_ENV}"
          echo "OCI_PRIVATE_KEY_PATH=${key_path}" >> "${GITHUB_ENV}"

      - name: Terraform Init
        shell: bash
        env:
          OCI_STATE_BUCKET: ${{ vars.OCI_STATE_BUCKET }}
          OCI_STATE_NAMESPACE: ${{ vars.OCI_STATE_NAMESPACE }}
          OCI_STATE_KEY: ${{ vars.OCI_STATE_KEY }}
          # Terraform's native OCI backend reads these case-sensitive names.
          OCI_region: ${{ vars.OCI_STATE_REGION || vars.OCI_REGION }}
          OCI_tenancy_ocid: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_user_ocid: ${{ secrets.OCI_USER_OCID }}
          OCI_fingerprint: ${{ secrets.OCI_FINGERPRINT }}
          OCI_private_key_path: ${{ runner.temp }}/oci_api_key.pem
        run: |
          set -euo pipefail
          terraform init -input=false -no-color -reconfigure \
            -backend-config="bucket=${OCI_STATE_BUCKET}" \
            -backend-config="namespace=${OCI_STATE_NAMESPACE}" \
            -backend-config="region=${OCI_region}" \
            -backend-config="key=${OCI_STATE_KEY}"

      - name: Terraform plan
        shell: bash
        env:
          TF_VAR_region: ${{ vars.OCI_REGION }}
          TF_VAR_tenancy_ocid: ${{ secrets.OCI_TENANCY_OCID }}
          TF_VAR_user_ocid: ${{ secrets.OCI_USER_OCID }}
          TF_VAR_fingerprint: ${{ secrets.OCI_FINGERPRINT }}
          # The native OCI backend needs credentials for every command that accesses remote state.
          OCI_region: ${{ vars.OCI_STATE_REGION || vars.OCI_REGION }}
          OCI_tenancy_ocid: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_user_ocid: ${{ secrets.OCI_USER_OCID }}
          OCI_fingerprint: ${{ secrets.OCI_FINGERPRINT }}
          OCI_private_key_path: ${{ runner.temp }}/oci_api_key.pem
        run: |
          set -euo pipefail
          terraform plan \
            -input=false \
            -no-color \
            -lock-timeout=5m \
            -out=tfplan

      - name: Upload plan artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: terraform-plan-${{ github.run_id }}
          path: tfplan
          if-no-files-found: error
          retention-days: 1

      - name: Remove temporary credentials and plan
        if: always()
        shell: bash
        run: rm -f "${RUNNER_TEMP}/oci_api_key.pem" tfplan

  apply:
    name: Apply OCI Terraform
    needs:
      - terraform-gate
      - check-required-secrets-variables
      - plan
    if: needs['terraform-gate'].outputs.enabled == 'true' && (always() && github.event_name != 'pull_request' && needs.plan.result == 'success' && needs['check-required-secrets-variables'].outputs.has_apply_inputs == 'true')
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'prod' || github.ref_name == 'dev' && 'dev' || github.ref_name == 'sbx' && 'sbx' || 'dev' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: ./.github/actions/setup-terraform
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Write OCI private key
        shell: bash
        env:
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          key_path="${RUNNER_TEMP}/oci_api_key.pem"
          private_key="${OCI_PRIVATE_KEY//$'\r'/}"
          if [[ "${private_key}" != *$'\n'* && "${private_key}" == *'\n'* ]]; then
            private_key="${private_key//\\n/$'\n'}"
          fi
          printf '%s\n' "${private_key}" > "${key_path}"
          chmod 600 "${key_path}"
          if ! openssl pkey -in "${key_path}" -noout -check > /dev/null 2>&1; then
            echo "OCI_PRIVATE_KEY is not a valid unencrypted PEM private key. Store the full PEM value as the GitHub secret, including its BEGIN/END lines." >&2
            exit 1
          fi
          delimiter="TF_VAR_PRIVATE_KEY_$(openssl rand -hex 16)"
          {
            printf 'TF_VAR_private_key<<%s\n' "${delimiter}"
            printf '%s\n' "${private_key}"
            printf '%s\n' "${delimiter}"
          } >> "${GITHUB_ENV}"
          echo "OCI_PRIVATE_KEY_PATH=${key_path}" >> "${GITHUB_ENV}"

      - name: Terraform Init
        shell: bash
        env:
          OCI_STATE_BUCKET: ${{ vars.OCI_STATE_BUCKET }}
          OCI_STATE_NAMESPACE: ${{ vars.OCI_STATE_NAMESPACE }}
          OCI_STATE_KEY: ${{ vars.OCI_STATE_KEY }}
          # Terraform's native OCI backend reads these case-sensitive names.
          OCI_region: ${{ vars.OCI_STATE_REGION || vars.OCI_REGION }}
          OCI_tenancy_ocid: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_user_ocid: ${{ secrets.OCI_USER_OCID }}
          OCI_fingerprint: ${{ secrets.OCI_FINGERPRINT }}
          OCI_private_key_path: ${{ runner.temp }}/oci_api_key.pem
        run: |
          set -euo pipefail
          terraform init -input=false -no-color -reconfigure \
            -backend-config="bucket=${OCI_STATE_BUCKET}" \
            -backend-config="namespace=${OCI_STATE_NAMESPACE}" \
            -backend-config="region=${OCI_region}" \
            -backend-config="key=${OCI_STATE_KEY}"

      - name: Download plan artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: terraform-plan-${{ github.run_id }}

      - name: Terraform Apply
        shell: bash
        env:
          # The native OCI backend needs credentials for every command that accesses remote state.
          OCI_region: ${{ vars.OCI_STATE_REGION || vars.OCI_REGION }}
          OCI_tenancy_ocid: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_user_ocid: ${{ secrets.OCI_USER_OCID }}
          OCI_fingerprint: ${{ secrets.OCI_FINGERPRINT }}
          OCI_private_key_path: ${{ runner.temp }}/oci_api_key.pem
        run: |
          set -euo pipefail
          terraform apply -auto-approve -input=false -no-color -lock-timeout=5m tfplan

      - name: Remove temporary credentials and plan
        if: always()
        shell: bash
        run: rm -f "${RUNNER_TEMP}/oci_api_key.pem" tfplan
